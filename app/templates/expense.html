{% extends 'base.html' %}{% block content %}<h1>Submit expense claim</h1>
<section class="panel">
    <form method="post" enctype="multipart/form-data"><label>Expense date</label><input type="date" name="expense_date"
            required><label>Category</label><select name="category">{% for c in
            ['TRAVEL','MEALS','LODGING','EQUIPMENT','OTHER'] %}<option>{{c}}</option>{% endfor %}</select><label>Cost
            center</label><select name="cost_center_id" required>{% for c in centers %}<option value="{{c.id}}">
                {{c.name}}</option>{% endfor %}</select>
        <h3>Expense lines (1–10)</h3>
        <div id="lines">{% for i in range(1,11) %}<div class="line expense-line" {% if i>1 %}hidden{% endif %}><b>Line
                    {{i}}</b><label>Description</label><input name="description[]" {% if i==1 %}required{% else
                    %}disabled{% endif %}><label>Amount</label><input name="amount[]" type="number" min="0.01"
                    step="0.01" {% if i==1 %}required{% else %}disabled{% endif %}><label>Receipt file</label><input
                    name="receipt_file[]" type="file" accept=".pdf,.png,.jpg,.jpeg" {% if i>1 %}disabled{% endif %}>
            </div>{% endfor %}</div><button type="button" id="add-line">Add another line</button><button
            type="submit">Submit expense</button>
    </form>
</section>
<script>let count = 1; document.getElementById('add-line').addEventListener('click', () => { if (count >= 10) return; count++; const el = document.querySelectorAll('.expense-line')[count - 1]; el.hidden = false; el.querySelectorAll('input').forEach(x => x.disabled = false); el.querySelector('input[name="description[]"]').required = true; el.querySelector('input[name="amount[]"]').required = true; });</script>
{% endblock %}
